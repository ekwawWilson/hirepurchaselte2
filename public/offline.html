<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You are offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f9; color: #0f172a; }
    .card { max-width: 360px; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px;
      box-shadow: 0 20px 45px -22px rgba(15, 23, 42, 0.35); }
    .dot { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: #eff6ff;
      display: flex; align-items: center; justify-content: center; font-size: 28px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; font-size: 14px; color: #fff; background: #2563eb; border: 0;
      border-radius: 12px; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot" aria-hidden="true">📶</div>
    <h1>You are offline</h1>
    <p>This page needs an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
